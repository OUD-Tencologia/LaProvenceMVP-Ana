name: Security

on:
  pull_request:
  push:
    branches:
      - main
      - develop
      - pagbank
      - 'security/**'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Dependency audit
        run: npm audit --audit-level=high

  secrets:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Secret scan
        run: |
          scan_dir="$(mktemp -d)"
          git archive HEAD | tar -x -C "$scan_dir"
          docker run --rm \
            -v "$scan_dir:/repo:ro" \
            ghcr.io/gitleaks/gitleaks:latest \
            dir --verbose --redact /repo

